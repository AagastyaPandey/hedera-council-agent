<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council Agent · Console</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/theme.css">
</head><body data-page="console" data-state="loading">
<div class="shell"><nav class="rail" id="rail"></nav>
<main>
  <div class="kicker" id="mode"></div>
  <h1>Console</h1>

  <!-- CONSOLE: three regions. #proposals (list), #record (selected proposal), #join (council seat). -->
  <section class="panel" id="new" aria-label="New proposal">
    <div class="label">New proposal</div>
    <form id="new-form">
      <div class="grid2">
        <div><label>Purpose</label><input name="purpose" value="Pay the venue deposit" required maxlength="200"></div>
        <div><label>Proposal id</label><input name="id" required pattern="[A-Za-z0-9_\-]{1,64}"></div>
        <div><label>Described payee</label><input name="payee" value="0.0.1001" required></div>
        <div><label>Described amount (HBAR)</label><input name="amount" value="0.1" required></div>
        <div><label>Actual transfer payee</label><input name="tpayee" value="0.0.1001" required></div>
        <div><label>Actual transfer amount (HBAR)</label><input name="tamount" value="0.1" required></div>
      </div>
      <p><button type="submit">Submit to the agent</button> <span class="muted">Make the actual transfer differ to see a refusal.</span></p>
    </form>
  </section>

  <section id="proposals" aria-label="Proposals"></section>
  <section id="record" aria-label="Selected proposal"></section>

  <section class="panel" id="join" aria-label="Join the council">
    <div class="label">Council seats</div>
    <p id="seats"></p>
    <button id="join-btn" class="secondary">Join the council (World ID)</button>
  </section>

  <div id="qr"></div>
  <p id="status" role="status"></p>
  <pre id="result" hidden></pre>
</main></div>
<script src="/vendor/idkit.js"></script>
<script type="module">
import { api, bus, hbar, qs } from "/assets/api.js";
import { mountRail } from "/assets/rail.js";
import { runWorldFlow, runMockedFlow } from "/assets/world-flow.js";
mountRail(document.getElementById("rail"), "/console.html");
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
const status = (t, cls = "") => { $("status").textContent = t; $("status").className = cls; };
const show = (o) => { $("result").hidden = false; $("result").textContent = JSON.stringify(o, null, 2); };
const toTiny = (h) => Math.round(Number(h) * 1e8);

let world = { configured: false, mockedAllowed: false };
let selected = qs("proposal");

async function refreshSeats() {
  const s = (await api.seats()).data;
  $("seats").textContent = `${s.count} seat${s.count === 1 ? "" : "s"} held. One person, one seat.`;
}

async function refreshList() {
  const rows = (await api.proposals()).data.proposals ?? [];
  const box = $("proposals");
  const t = el("table");
  const head = t.insertRow();
  for (const h of ["Proposal", "Amount", "Check", "Decision"]) head.append(Object.assign(document.createElement("th"), { textContent: h }));
  for (const p of rows) {
    const tr = t.insertRow(); tr.dataset.proposal = p.id; tr.dataset.decision = p.decision ?? "PENDING"; tr.style.cursor = "pointer";
    tr.insertCell().textContent = `${p.id}${p.large ? " · large" : ""}`;
    tr.insertCell().textContent = hbar(p.amountTinybars);
    const c = tr.insertCell(); c.textContent = p.matches ? "matches" : "MISMATCH"; c.className = p.matches ? "ok" : "red";
    tr.insertCell().textContent = p.decision ?? "not submitted";
    tr.onclick = () => select(p.id);
  }
  box.replaceChildren(rows.length ? t : el("p", "No proposals yet.", "muted"));
}

async function select(id) {
  selected = id;
  history.replaceState(null, "", `?proposal=${encodeURIComponent(id)}`);
  const r = await api.proposal(id);
  const box = $("record");
  if (!r.ok) { box.replaceChildren(el("p", r.data.error, "red")); return; }
  const { proposal: p, check, lastOutcome: o, large, approval } = r.data;
  const panel = el("div", undefined, "panel"); panel.dataset.proposal = id;
  panel.append(el("div", `Record · ${p.id}`, "label"), el("h2", p.description.purpose));
  const t = el("table");
  const head = t.insertRow(); for (const h of ["", "Described", "Actual"]) head.append(Object.assign(document.createElement("th"), { textContent: h }));
  for (const [k, d, a] of [["Payee", p.description.payee, p.transfer.payee], ["Amount", hbar(p.description.amountTinybars), hbar(p.transfer.amountTinybars)], ["Token", p.description.token, p.transfer.token]]) {
    const tr = t.insertRow(); tr.append(Object.assign(document.createElement("th"), { textContent: k })); tr.insertCell().textContent = d; const c = tr.insertCell(); c.textContent = a; if (d !== a) c.className = "red";
  }
  panel.append(t, el("p", check.verdict, check.matches ? "ok" : "red"));
  if (o) { const d = el("p", `${o.decision}: ${o.reason}`); d.dataset.decision = o.decision; panel.append(d); }
  const actions = el("p");
  const sub = el("button", o ? "Submit again" : "Submit to the agent"); sub.onclick = async () => { const res = await api.submit(p); show(res.data); status(res.data.decision === "SIGNED" ? `Agent signed. Scheduled tx ${res.data.scheduledTxId}.` : `Agent refused: ${res.data.reason}`, res.data.decision === "SIGNED" ? "ok" : "red"); await refreshList(); await select(id); };
  actions.append(sub);
  if (large && check.matches) {
    const ap = el("button", approval ? `World ID approved (${approval.source}), valid to ${new Date(approval.expiresAt).toLocaleTimeString()}` : world.configured ? "Approve with World ID" : "Approve (MOCKED demo)", "secondary");
    ap.disabled = Boolean(approval) || (!world.configured && !world.mockedAllowed);
    ap.onclick = async () => { ap.disabled = true; await approve(id); await select(id); };
    actions.append(" ", ap);
  }
  panel.append(actions);
  box.replaceChildren(panel);
}

async function approve(proposalId) {
  const res = world.configured
    ? await runWorldFlow({ proposalId, onQr: (_u, svg) => { const i = el("img"); i.src = svg; i.alt = "Scan with World App"; $("qr").replaceChildren(i); }, onStatus: status })
    : await runMockedFlow({ proposalId });
  $("qr").replaceChildren();
  status(res.ok ? `Approved${res.data.source === "mocked" ? " (MOCKED, demo only)" : " with World ID"}. Single use, 5 minutes.` : res.data.error, res.ok ? "ok" : "red");
}

$("new-form").onsubmit = async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const proposal = {
    id: f.id,
    description: { payee: f.payee, amountTinybars: toTiny(f.amount), token: "HBAR", purpose: f.purpose },
    transfer: { payee: f.tpayee, amountTinybars: toTiny(f.tamount), token: "HBAR" },
  };
  const res = await api.submit(proposal);
  if (res.status >= 400) { status(res.data.error, "red"); return; }
  show(res.data);
  status(res.data.decision === "SIGNED" ? `Agent signed. Scheduled tx ${res.data.scheduledTxId}.` : `Agent refused: ${res.data.reason}`, res.data.decision === "SIGNED" ? "ok" : "red");
  await refreshList(); await select(proposal.id);
};
$("new-form").elements.id.value = `P-${Date.now().toString(36).toUpperCase()}`;

$("join-btn").onclick = async () => {
  $("join-btn").disabled = true;
  const res = world.configured
    ? await runWorldFlow({ join: true, onQr: (_u, svg) => { const i = el("img"); i.src = svg; $("qr").replaceChildren(i); }, onStatus: status })
    : world.mockedAllowed ? await runMockedFlow({ join: true }) : { ok: false, data: { error: "World ID is not configured here." } };
  $("qr").replaceChildren();
  status(res.ok ? `Joined: ${res.data.seat} (${res.data.proof}).` : res.data.error, res.ok ? "ok" : "red");
  $("join-btn").disabled = false; await refreshSeats();
};

bus.addEventListener("proposal:decision", (e) => { document.body.dataset.decision = e.detail.outcome.decision; });

const h = (await api.health()).data;
$("mode").textContent = `mode ${h.mode} · ${h.network} · World ${h.world}`;
world = (await api.worldConfig()).data;
await Promise.all([refreshList(), refreshSeats()]);
if (selected) await select(selected);
if (location.hash === "#join") $("join").scrollIntoView();
document.body.dataset.state = "ready";
</script>
</body></html>
