<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council approval · World ID</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .muted { opacity: .7; font-size: .9rem; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #8884; }
  .bad { color: #c62828; font-weight: 600; }
  .ok { color: #2e7d32; font-weight: 600; }
  .tag { display: inline-block; padding: 0 .4rem; border-radius: 4px; background: #f9a82533; font-size: .8rem; }
  button { font: inherit; padding: .55rem 1rem; border-radius: 6px; border: 1px solid #8886; cursor: pointer; margin-right: .5rem; }
  button[disabled] { opacity: .5; cursor: default; }
  #qr img { width: 240px; height: 240px; background: #fff; padding: 8px; border-radius: 8px; }
  pre { white-space: pre-wrap; word-break: break-word; background: #8881; padding: .75rem; border-radius: 6px; font-size: .85rem; }
</style>
</head>
<body>
<h1 id="title">Council approval</h1>
<p class="muted" id="subtitle"></p>
<div id="details"></div>
<div id="actions"></div>
<div id="qr"></div>
<p id="status"></p>
<pre id="result" hidden></pre>
<script src="/vendor/idkit.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const proposalId = params.get("proposal");
const joinMode = params.has("join");

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function setStatus(text, cls) { const s = $("status"); s.textContent = text; s.className = cls || ""; }
function showResult(obj) { const r = $("result"); r.hidden = false; r.textContent = JSON.stringify(obj, null, 2); }
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  return { status: r.status, data };
}
function hbar(t) { return `${(t / 1e8).toLocaleString(undefined, { maximumFractionDigits: 8 })} HBAR`; }

function renderProposal(info) {
  const p = info.proposal;
  const t = el("table");
  const head = el("tr"); ["", "Description", "Actual transfer"].forEach((h) => head.appendChild(el("th", h))); t.appendChild(head);
  const rows = [
    ["Payee", p.description.payee, p.transfer.payee],
    ["Amount", hbar(p.description.amountTinybars), hbar(p.transfer.amountTinybars)],
    ["Token", p.description.token, p.transfer.token],
  ];
  for (const [k, d, a] of rows) {
    const tr = el("tr"); tr.appendChild(el("th", k)); tr.appendChild(el("td", d)); tr.appendChild(el("td", a, d === a ? "" : "bad")); t.appendChild(tr);
  }
  $("details").replaceChildren(el("p", `Purpose: ${p.description.purpose}`), t,
    el("p", info.check.matches ? "Check: the transfer matches its description." : `Check: ${info.check.verdict}`, info.check.matches ? "ok" : "bad"));
}

async function signNow(proposal) {
  setStatus("Asking the agent to sign…");
  const r = await api("POST", "/proposals", { proposal });
  showResult(r.data);
  setStatus(r.data.decision === "SIGNED" ? `Agent signed. Scheduled tx ${r.data.scheduledTxId}.` : `Agent refused: ${r.data.reason}`, r.data.decision === "SIGNED" ? "ok" : "bad");
}

async function afterApproval(res, proposal) {
  $("qr").replaceChildren();
  if (res.status !== 200) { setStatus(res.data.error || "Failed.", "bad"); showResult(res.data); return; }
  if (joinMode) { setStatus(`Joined: ${res.data.seat} (${res.data.proof}).`, "ok"); showResult(res.data); return; }
  setStatus(`Approved${res.data.source === "mocked" ? " (MOCKED, demo only)" : " with World ID"}. Valid until ${new Date(res.data.expiresAt).toLocaleTimeString()}, single use.`, "ok");
  const b = el("button", "Ask the agent to sign now"); b.onclick = () => { b.disabled = true; signNow(proposal); };
  $("actions").replaceChildren(b);
}

async function worldFlow(cfg, proposal) {
  setStatus("Preparing a signed World ID request…");
  const ctx = await api("POST", "/world/rp-context", joinMode ? { join: true } : { proposalId });
  if (ctx.status !== 200) { setStatus(ctx.data.error, "bad"); return; }
  const request = await IDKit.request({
    app_id: ctx.data.appId,
    action: ctx.data.action,
    rp_context: ctx.data.rpContext,
    allow_legacy_proofs: true,
    environment: ctx.data.environment,
  }).preset(IDKit.proofOfHuman());
  const img = el("img"); img.alt = "Scan with World App"; img.src = `/world/qr.svg?data=${encodeURIComponent(request.connectorURI)}`;
  const link = el("a", "Open in World App"); link.href = request.connectorURI;
  $("qr").replaceChildren(img, el("br"), link);
  setStatus(`Scan with World App to prove you are human for "${ctx.data.action}". Waiting…`);
  const done = await request.pollUntilCompletion({ pollInterval: 2000, timeout: 180000 });
  if (!done.success) { $("qr").replaceChildren(); setStatus(`World ID did not complete: ${done.error}. The agent does not sign.`, "bad"); return; }
  setStatus("Verifying the proof on the server…");
  const res = joinMode
    ? await api("POST", "/council/join", { idkitResult: done.result })
    : await api("POST", "/world/verify", { proposalId, idkitResult: done.result });
  await afterApproval(res, proposal);
}

async function main() {
  const cfg = (await api("GET", "/world/config")).data;
  $("subtitle").textContent = cfg.configured
    ? `World ID ${cfg.environment}. The server verifies every proof; approvals are single use.`
    : "World ID is not configured on this server: demo mode, approvals are MOCKED.";
  let proposal = null;
  if (joinMode) {
    $("title").textContent = "Join the council";
    $("details").replaceChildren(el("p", "Prove you are a unique human to take one council seat. One person, one seat."));
  } else if (proposalId) {
    $("title").textContent = `Approve proposal ${proposalId}`;
    const info = await api("GET", `/proposals/${encodeURIComponent(proposalId)}`);
    if (info.status !== 200) { setStatus(info.data.error, "bad"); return; }
    proposal = info.data.proposal;
    renderProposal(info.data);
    if (!info.data.check.matches) { setStatus("This proposal does not match its description. The agent will refuse it whatever you approve.", "bad"); return; }
    if (info.data.approval) { await afterApproval({ status: 200, data: { approved: true, ...info.data.approval } }, proposal); return; }
  } else {
    setStatus("Open this page as /world.html?proposal=<id> or /world.html?join", "bad");
    return;
  }
  const buttons = [];
  if (cfg.configured) {
    const b = el("button", joinMode ? "Join with World ID" : "Approve with World ID");
    b.onclick = () => { b.disabled = true; worldFlow(cfg, proposal).catch((e) => setStatus(String(e), "bad")); };
    buttons.push(b);
  } else if (cfg.mockedAllowed) {
    const b = el("button", joinMode ? "Join (MOCKED demo)" : "Approve (MOCKED demo)");
    b.appendChild(el("span", " MOCKED", "tag"));
    b.onclick = async () => {
      b.disabled = true;
      const res = joinMode
        ? await api("POST", "/council/join", { mocked: true, nullifier: `demo-${crypto.randomUUID()}` })
        : await api("POST", "/world/verify", { proposalId, mocked: true });
      await afterApproval(res, proposal);
    };
    buttons.push(b);
  } else {
    setStatus("World ID is not configured and mocked approvals are disabled here.", "bad");
  }
  $("actions").replaceChildren(...buttons);
}
main().catch((e) => setStatus(String(e), "bad"));
</script>
</body>
</html>
